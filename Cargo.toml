[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0-dev"
publish = false
license = "Apache-2.0"
authors = ["Estanislao Pérez Nartallo <tanisperez@gmail.com>"]

[workspace.dependencies]
gpui-kit = "0.10.0"
# The design system and standard components shared with Postino, Vano, Nastro and ted. Same
# gpui-kit pin.
telaio-ui = { git = "https://github.com/tanisperez/telaio", tag = "v0.32.0" }
# The application shell: logging, command line pieces, language, numbers, paths, window bootstrap.
telaio-app = { git = "https://github.com/tanisperez/telaio", tag = "v0.32.0" }
# The in-app updater shared with Postino and ted.
telaio-update = { git = "https://github.com/tanisperez/telaio", tag = "v0.32.0" }
serde = "1"
serde_json = "1"
pretty_assertions = "1.4"
tempfile = "3"
toml = "1"
log = "0.4"
# Local dates for the energy account; the version gpui already builds.
chrono = "0.4.45"
# Already built by gpui-component (translations); same version.
rust-i18n = "4.2"
# CPU, memory, disks, networks, processes and the temperature sensors, on Linux and Windows.
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk", "network", "component", "user"] }

[workspace.lints.clippy]
all = "warn"
unwrap_used = "warn"
expect_used = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"

# As in Postino: fat LTO, one codegen unit and stripped, measured there as the best size and RSS
# for no runtime cost. Panics stay as unwind.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# gpui and the other dependencies are far too slow unoptimized (see Postino #34). Optimizing only
# the dependencies keeps the UI usable in debug builds while the workspace's own crates stay quick
# to rebuild and debug.
[profile.dev.package."*"]
opt-level = 2
