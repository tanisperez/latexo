[package]
name = "latexo-sensors"
description = "Reads the machine for Latexo: CPU, memory, disks, network, sensors, GPUs, power and processes. No gpui."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
latexo-core = { path = "../latexo-core" }
sysinfo = { workspace = true, features = ["gpu"] }
log = { workspace = true }

# The battery on Windows (charge, power, plugged in); Linux reads /sys itself.
[target.'cfg(windows)'.dependencies]
starship-battery = { version = "0.12", default-features = false }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
