"processes.end_text":
  en: "The process with PID %{pid} will stop running and any unsaved changes it has will be lost."
  es: "El proceso con PID %{pid} dejará de ejecutarse y los cambios sin guardar que tenga se perderán."
  gl: "O proceso co PID %{pid} deixará de executarse e os cambios sen gardar que teña perderanse."
  it: "Il processo con PID %{pid} smetterà di funzionare e le modifiche non salvate andranno perse."
