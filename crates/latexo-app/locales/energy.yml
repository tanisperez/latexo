"energy.note_root":
  en: "The processor power counter can only be read by root on this system. On battery, Latexo measures the whole laptop from the battery instead."
  es: "En este sistema solo root puede leer el contador de consumo del procesador. Con batería, Latexo mide el portátil entero desde la batería."
  gl: "Neste sistema só root pode ler o contador de consumo do procesador. Con batería, Latexo mide o portátil enteiro desde a batería."
  it: "Su questo sistema solo root può leggere il contatore di potenza del processore. A batteria, Latexo misura l'intero portatile dalla batteria."
"energy.note_windows":
  en: "Windows does not report the processor power without a driver. On battery, Latexo measures the whole laptop from the battery."
  es: "Windows no informa del consumo del procesador sin un controlador. Con batería, Latexo mide el portátil entero desde la batería."
  gl: "Windows non informa do consumo do procesador sen un controlador. Con batería, Latexo mide o portátil enteiro desde a batería."
  it: "Windows non comunica la potenza del processore senza un driver. A batteria, Latexo misura l'intero portatile dalla batteria."
"energy.note_none":
  en: "This computer has no power sensor Latexo can read. On battery, Latexo measures the whole laptop from the battery."
  es: "Este equipo no tiene ningún sensor de consumo que Latexo pueda leer. Con batería, Latexo mide el portátil entero desde la batería."
  gl: "Este equipo non ten ningún sensor de consumo que Latexo poida ler. Con batería, Latexo mide o portátil enteiro desde a batería."
  it: "Questo computer non ha nessun sensore di potenza che Latexo possa leggere. A batteria, Latexo misura l'intero portatile dalla batteria."
