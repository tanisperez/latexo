[package]
name = "latexo-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "latexo"
path = "src/main.rs"

[dependencies]
gpui-kit = { workspace = true }
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }
log = { workspace = true }
rust-i18n = { workspace = true }
telaio-ui = { workspace = true }
telaio-app = { workspace = true }
telaio-update = { workspace = true }
latexo-cli = { path = "../latexo-cli" }
latexo-core = { path = "../latexo-core" }
latexo-sensors = { path = "../latexo-sensors" }

# The Windows resources, compiled when the target is Windows (build.rs), from any host.
[build-dependencies]
embed-resource = "3"

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
pretty_assertions = { workspace = true }

[lints]
workspace = true
