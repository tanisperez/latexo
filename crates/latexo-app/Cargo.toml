[package]
name = "latexo-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "latexo"
path = "src/main.rs"

[dependencies]
gpui-kit = { workspace = true }
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
async-channel = "2.5"
rust-i18n = { workspace = true }
telaio-ui = { workspace = true }
telaio-app = { workspace = true }
telaio-update = { workspace = true }
latexo-cli = { path = "../latexo-cli" }
latexo-core = { path = "../latexo-core" }
latexo-sensors = { path = "../latexo-sensors" }
notify-rust = { version = "4.19", default-features = false, features = ["z"] }

# The tray icon on Linux: a StatusNotifierItem over D-Bus, on the zbus and async-io gpui already
# builds (no tokio).
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }

# The tray icon on Windows.
[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.21", default-features = false }

# The Windows resources, compiled when the target is Windows (build.rs), from any host.
[build-dependencies]
embed-resource = "3"

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
pretty_assertions = { workspace = true }

[lints]
workspace = true
